# Production frontend: static files + the same Staple proxy the Vite dev server
# provides.
#
# The proxy is not optional. Staple gates CORS on a WHITELISTED_ORIGINS
# allowlist, so a browser calling dash-dev.staple.io directly from this origin
# gets a 405 preflight with no Access-Control-Allow-Origin and login fails.
# Proxying keeps the browser same-origin in prod exactly as it is in dev, and
# means shipping does not depend on an ops change on the Staple side.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Staple GraphQL — mirrors vite.config.js `/staple` proxy.
    location /staple/ {
        proxy_pass https://dash-dev.staple.io/;
        proxy_set_header Host dash-dev.staple.io;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # SPA: every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}
